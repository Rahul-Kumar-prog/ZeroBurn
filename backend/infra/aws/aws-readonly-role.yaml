AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Creates a read-only IAM role that allows Zeroburn to
  analyze AWS resources, usage, metrics, and costs.

Parameters:

  ExternalId:
    Type: String
    NoEcho: true
    Description: >
      Unique external ID generated by Zeroburn for this customer.

Resources:

  ZeroburnReadOnlyRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: ZeroburnReadOnlyRole

      Description: >
        Read-only role used by Zeroburn for AWS cost
        optimization and resource analysis.

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:

          - Sid: ZeroburnAssumeRole

            Effect: Allow

            Principal:
              AWS: "arn:aws:iam::574667602911:user/rkchaudhary"

            Action:
              - sts:AssumeRole

            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId

      Policies:

        - PolicyName: ZeroburnReadOnlyPolicy

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              # ----------------------------------------
              # EC2
              # ----------------------------------------

              - Sid: EC2ReadOnly

                Effect: Allow

                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeImages
                  - ec2:DescribeVolumes
                  - ec2:DescribeSnapshots
                  - ec2:DescribeAddresses
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - ec2:DescribeRouteTables
                  - ec2:DescribeNatGateways
                  - ec2:DescribeTags
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeRegions
                  - ec2:DescribeAutoScalingGroups
                  - ec2:DescribeLaunchTemplates
                  - ec2:DescribeLaunchTemplateVersions

                Resource: "*"


              # ----------------------------------------
              # EKS
              # ----------------------------------------

              - Sid: EKSReadOnly

                Effect: Allow

                Action:
                  - eks:DescribeCluster
                  - eks:ListClusters
                  - eks:DescribeNodegroup
                  - eks:ListNodegroups
                  - eks:DescribeFargateProfile
                  - eks:ListFargateProfiles
                  - eks:ListTagsForResource

                Resource: "*"


              # ----------------------------------------
              # RDS
              # ----------------------------------------

              - Sid: RDSReadOnly

                Effect: Allow

                Action:
                  - rds:DescribeDBInstances
                  - rds:DescribeDBClusters
                  - rds:DescribeDBSnapshots
                  - rds:DescribeDBClusterSnapshots
                  - rds:DescribeReservedDBInstances
                  - rds:DescribeReservedDBInstancesOfferings
                  - rds:DescribeDBParameterGroups
                  - rds:DescribeDBSubnetGroups
                  - rds:ListTagsForResource

                Resource: "*"


              # ----------------------------------------
              # Lambda
              # ----------------------------------------

              - Sid: LambdaReadOnly

                Effect: Allow

                Action:
                  - lambda:ListFunctions
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:ListVersionsByFunction
                  - lambda:ListAliases
                  - lambda:ListTags

                Resource: "*"


              # ----------------------------------------
              # S3
              # ----------------------------------------

              - Sid: S3ReadOnly

                Effect: Allow

                Action:
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                  - s3:GetBucketTagging
                  - s3:GetBucketVersioning
                  - s3:GetBucketLifecycleConfiguration
                  - s3:GetBucketEncryption
                  - s3:GetBucketPublicAccessBlock

                Resource: "*"


              # ----------------------------------------
              # CloudWatch
              # ----------------------------------------

              - Sid: CloudWatchReadOnly

                Effect: Allow

                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:GetDashboard
                  - cloudwatch:ListDashboards

                Resource: "*"


              # ----------------------------------------
              # Cost Explorer
              # ----------------------------------------

              - Sid: CostExplorerReadOnly

                Effect: Allow

                Action:
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                  - ce:GetDimensionValues
                  - ce:GetTags
                  - ce:GetRightsizingRecommendation
                  - ce:GetSavingsPlansPurchaseRecommendation
                  - ce:GetReservationPurchaseRecommendation
                  - ce:GetReservationUtilization
                  - ce:GetSavingsPlansUtilization
                  - ce:GetSavingsPlansCoverage
                  - ce:GetReservationCoverage

                Resource: "*"


              # ----------------------------------------
              # Savings Plans
              # ----------------------------------------

              - Sid: SavingsPlansReadOnly

                Effect: Allow

                Action:
                  - savingsplans:DescribeSavingsPlans
                  - savingsplans:DescribeSavingsPlansOfferings

                Resource: "*"


              # ----------------------------------------
              # Auto Scaling
              # ----------------------------------------

              - Sid: AutoScalingReadOnly

                Effect: Allow

                Action:
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:DescribeAutoScalingInstances
                  - autoscaling:DescribeLaunchConfigurations
                  - autoscaling:DescribePolicies
                  - autoscaling:DescribeScalingActivities
                  - autoscaling:DescribeScheduledActions

                Resource: "*"


              # ----------------------------------------
              # IAM metadata
              # ----------------------------------------

              - Sid: IAMReadOnly

                Effect: Allow

                Action:
                  - iam:GetAccountSummary
                  - iam:GetRole
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListRoles
                  - iam:ListPolicies
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfiles
                  - iam:GetInstanceProfile
                  - iam:ListGroups
                  - iam:ListUsers

                Resource: "*"


              # ----------------------------------------
              # AWS Organizations
              # ----------------------------------------

              - Sid: OrganizationsReadOnly

                Effect: Allow

                Action:
                  - organizations:DescribeOrganization
                  - organizations:ListAccounts
                  - organizations:ListRoots
                  - organizations:ListOrganizationalUnitsForParent
                  - organizations:ListParents

                Resource: "*"


              # ----------------------------------------
              # Resource Groups Tagging
              # ----------------------------------------

              - Sid: ResourceTaggingReadOnly

                Effect: Allow

                Action:
                  - resourcegroupstaggingapi:GetResources
                  - resourcegroupstaggingapi:GetTagKeys
                  - resourcegroupstaggingapi:GetTagValues

                Resource: "*"


      Tags:
        - Key: ManagedBy
          Value: Zeroburn

        - Key: Purpose
          Value: CostOptimization

Outputs:

  ZeroburnRoleArn:
    Description: ARN of the Zeroburn read-only role
    Value: !GetAtt ZeroburnReadOnlyRole.Arn

  ZeroburnRoleName:
    Description: Name of the Zeroburn read-only role
    Value: !Ref ZeroburnReadOnlyRole